aid: uhnder
name: Uhnder
description: 'Uhnder is an Austin, Texas fabless semiconductor company founded in 2015
  that designs the S80 and S81 77 GHz 4D digital imaging Radar-on-Chip (RoC) for automotive
  ADAS and automated mobility. Its Digital Code Modulation (DCM) approach on a 28nm
  RF CMOS process replaces analog FMCW radar with a software-defined sensor, and each
  RoC ships with an ASPICE-qualified Software Development Kit carrying ready-to-integrate
  software APIs, on-chip user algorithm support and system tools for Tier-1 and OEM
  radar stacks. Uhnder is a chip supplier rather than a web-API provider: the SDK and
  its APIs are embedded interfaces delivered under a commercial customer relationship,
  and the company publishes no public developer portal, documentation host or machine-readable
  API contract.'
